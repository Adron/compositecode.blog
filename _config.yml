title: "Adron's Composite Code"
description: "Technological and coding misadventures!"
author:
  name: Adron Hall
  display_name: Adron   # shown in post bylines, as on WordPress
  url: /author/adron/
  bio: "See: http://compositecode.blog/about"
url: "https://compositecode.blog"
baseurl: "" # set by the deploy workflow; non-empty only for the github.io preview
lang: en_US
timezone: America/Los_Angeles

# Posts live in posts/_posts/YYYY/. Every exported post pins its WordPress URL with a `permalink`
# front matter key; new posts get the same WordPress shape from this pattern (:title = filename slug,
# or the `slug` front matter key if set).
collections_dir: posts
permalink: /:year/:month/:day/:title/

# Five posts per page, as on WordPress, so /page/N/ (and /category/x/page/N/ etc.) hold the same posts.
paginate: 5
paginate_path: /page/:num/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: null

feed:
  path: feed.xml
  posts_limit: 20

defaults:
  # Exported content contains {{ }} and {% %} in code samples; never run it through Liquid.
  - scope: { path: "", type: posts }
    values: { layout: post, render_with_liquid: false }
  - scope: { path: "pages" }
    values: { layout: page, render_with_liquid: false }

exclude:
  - README.md
  - punch-list.md
  - scripts/
  - dns/
  - posts/_raw/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .venv/
  - .github/
