---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    {% include post-meta.html post=page %}
  </header>
  <div class="content">
    {{ content }}
  </div>
  {% if page.tags.size > 0 %}
  <p class="tags">{% for t in page.tags %}<a href="{{ t | term_url: 'tags' }}">#{{ t }}</a>{% endfor %}</p>
  {% endif %}
  <nav class="post-nav">
    {% if page.previous %}<a class="prev" href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>{% endif %}
    {% if page.next %}<a class="next" href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>{% endif %}
  </nav>
</article>
