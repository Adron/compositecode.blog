---
layout: default
---
<h1 class="archive-title">{{ page.title }}</h1>
<p class="archive-count">{{ page.archive_posts.size }} post{% if page.archive_posts.size != 1 %}s{% endif %}</p>
<ul class="archive-list">
  {% for post in page.archive_posts %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time> <a href="{{ post.url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
