<div class="entry-author author-avatar-show">
  <div class="author-avatar">
    <img alt="" src="/assets/images/avatar-adron-96.png" class="avatar avatar-48 photo" height="48" width="48" loading="lazy" decoding="async">
  </div><!-- .author-avatar -->
  <div class="author-heading">
    <h2 class="author-title">Published by <span class="author-name">{{ site.author.display_name }}</span></h2>
  </div><!-- .author-heading -->
  <p class="author-bio">
    {{ site.author.bio }}
    <a class="author-link" href="{{ site.author.url }}" rel="author">View all posts by {{ site.author.display_name }}</a>
  </p><!-- .author-bio -->
</div><!-- .entry-author -->
